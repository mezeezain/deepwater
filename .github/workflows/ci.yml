name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Syntax check every script
        run: |
          for f in js/*.js js/views/*.js worker/*.mjs tools/*.mjs; do node --check "$f"; done
          bash -n deploy/setup.sh
